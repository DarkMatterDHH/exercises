<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script src="jsinclass.js" defer></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <p id="randomNumber"></p>
      <button id="generate-button">Generate Random Number</button>
    </div>
    <div class="guess-container">
      <label for="counter">Guess Count:</label>
      <span id="counter">0</span>
      <label for="guess-input">Your Guess:</label>
      <input
        type="number"
        value=""
        id="guess-input"
        placeholder="Enter your guess"
      />
      <p id="result"></p>
      <button id="guess-button">Submit Guess</button>
    </div>
  </body>
</html>
