<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guess a Number</title>
    <link rel="stylesheet" href="guess-a-number.css" />
    <script src="guess-a-number.js" defer></script>
  </head>
  <body>
    <div class="container">
      <h1>Guess a Number</h1>
      <p class="instructions">
        The computer has to guess a number between 1 and 100 that you're
        thinking of!
      </p>
      <p class="prompt">Here you can see what the computer is guessing:</p>
      <p id="guess"></p>
      <button id="start" class="button">Start</button>
      <button id="lower" class="button">lower</button>
      <button id="correct" class="button">correct</button>
      <button id="higher" class="button">higher</button>
      <p id="result"></p>
    </div>
  </body>
</html>
